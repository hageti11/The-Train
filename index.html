function setRoute(i){RT=i;const r=ROUTES[i];pieces=r.pieces;P=[];Rl=[];let x=0,y=0,an=0;for(const[l,R]of pieces)for(let j=0;j<l;j++){P.push([x,y,an]);Rl.push(R);an+=R?1/R:0;x+=Math.cos(an);y+=Math.sin(an)}P.push([x,y,an]);Rl.push(0);L=P.length-1;ST=r.st.map(a=>({n:a[0],c:a[1],t:a[2]}));VB=r.vb;UB=r.ub;XS=r.xs;LM=new Array(L+1).fill(r.vb);
 {let p=0;for(const[l,R]of pieces){if(R){const v=Math.floor(3*Math.sqrt(Math.abs(R))/5)*5;for(let j=Math.max(0,p-40);j<p+l+90&&j<=L;j++)LM[j]=Math.min(LM[j],v)}p+=l}}

function step(dt){
 if(S.done)return;

 if(v<.02&&a<0)a=0;
 let nv=Math.max(0,v+a*dt);
 const j=(a-S.pa)/dt;S.pa=a;S.ja+=(j-S.ja)*Math.min(1,dt*5);

}

 if(S.done){if(S.crash)ov('車止めに衝突!',['終点手前で十分に減速してください','ページを再読み込みで再挑戦']);else{const rs=S.R.filter(Boolean),avg=f=>rs.length?rs.reduce((a,q)=>a+q[f],0)/rs.length:0,tot=avg('p')*.4+avg('pt')*.3+S.comfort*.3,rk=tot>=90?'S':tot>=75?'A':tot>=60?'B':'C';
  ov('運転終了  評価 '+rk,[`総合 ${tot.toFixed(0)}点`,`停止位置 ${avg('p').toFixed(0)} / 定時性 ${avg('pt').toFixed(0)} / 乗り心地 ${S.comfort.toFixed(0)}`,'ページを再読み込みで再挑戦'])}}
}
let last=performance.now(),acc=0;
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;loadT+=dt;if(started){acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}if(S.mt>0)S.mt-=dt}draw();hud();requestAnimationFrame(loop)}
setRoute(0);requestAnimationFrame(loop);
</script></body></html>
