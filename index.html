const hs=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

E.forEach((e,i)=>{[e.a,e.b].forEach((ni,k)=>{const n=NK[ni],o=NK[k?e.a:e.b],al=Math.atan2(o.y-n.y,o.x-n.x),sd=Math.cos(al-n.ax)>=0?1:-1;e['e'+k]={n:ni,sd};n.side[sd].push({e:i,k})})});
E.forEach(e=>{const A=NK[e.a],B=NK[e.b],d=Math.hypot(B.x-A.x,B.y-A.y),k=d*(e.c?.3:.38),ta=A.ax+(e.e0.sd>0?0:Math.PI),tb=B.ax+(e.e1.sd>0?0:Math.PI),p1=[A.x+Math.cos(ta)*k,A.y+Math.sin(ta)*k],p2=[B.x+Math.cos(tb)*k,B.y+Math.sin(tb)*k];

 const N=800,pts=[],cl=[0];for(let i=0;i<=N;i++){pts.push(bz(i/N));if(i)cl.push(cl[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}

 e.xs=e.c?[]:[e.len*(.25+.2*hs(e.a+e.b)),e.len*(.6+.2*hs(e.a*3+e.b))];if(NK[e.a].t)e.pl.push({s:350,n:e.a});if(NK[e.b].t)e.pl.push({s:e.len-350,n:e.b});

const NA=(a)=>{a=a%(2*Math.PI);if(a>Math.PI)a-=2*Math.PI;if(a<-Math.PI)a+=2*Math.PI;return a};
const CC={};
function cands(ei,k,cls){const ed=E[ei]['e'+k],key=ed.n+'|'+ed.sd+'|'+cls;if(CC[key])return CC[key];const n=NK[ed.n],ex=n.ax+(-ed.sd>0?0:Math.PI);const L=n.side[-ed.sd].filter(c=>E[c.e].c==cls).map(c=>{const o=E[c.e]['e'+(1-c.k)].n,al=Math.atan2(NK[o].y-n.y,NK[o].x-n.x);return{e:c.e,k:c.k,nm:NK[o].n,turn:NA(al-ex)}});L.sort((p,q)=>p.turn-q.turn);return CC[key]=L}

const TRS=[{n:2,nm:'ローカル2両',m:80000,F:70000,P:.8e6,c:'#c8921a',mx:95,bk:1,pc:40,lk:0,cls:0,pr:0},{n:4,nm:'通勤型4両',m:151000,F:130000,P:1.6e6,c:'#1b7f5a',mx:110,bk:1,pc:90,lk:0,cls:0,pr:0},{n:5,nm:'特急型5両',m:200000,F:150000,P:2.8e6,c:'#1a5fb4',mx:130,bk:1.1,pc:60,lk:0,cls:0,pr:1},{n:6,nm:'急行6両',m:260000,F:170000,P:3.6e6,c:'#c0392b',mx:120,bk:1.1,pc:80,lk:0,cls:0,pr:3},{n:6,nm:'新幹線6両',m:330000,F:260000,P:8e6,c:'#1a5fb4',mx:275,bk:1.6,pc:100,lk:3,cls:1,pr:5},{n:6,nm:'貨物6両',m:520000,F:280000,P:2.4e6,c:'#444',mx:85,bk:.55,pc:0,lk:1,cls:0,pr:8},{n:4,nm:'蒸気機関車4両',m:240000,F:190000,P:1.2e6,c:'#222',mx:60,bk:.6,pc:30,lk:2,cls:0,pr:12}];
let TRi=1,TR=TRS[1];const own=[1,1,0,0,0,0,0];
const T={e:0,s:380,dir:1,v:0,h:0,bp:0,prev:null,pick:0,cls:0};T.pick=defPick(cands(0,1,0));
const S={t:0,doors:false,board:0,ats:0,pax:0,last:0,money:0,msg:'',mt:0,wp:1,pa:0};let M=null;
const bots=[];for(let i=0;i<16;i++){const c=i<12?0:1,L=E.map((e,j)=>e.c==c?j:-1).filter(j=>j>=0),ei=L[Math.floor(hs(i*3.3)*L.length)];bots.push({e:ei,s:hs(i)*E[ei].len,dir:hs(i+9)>.5?1:-1,v:c?55+hs(i)*8:20+hs(i+4)*14,n:c?6:3+i%3,col:['#7a3fb0','#b04f3f','#2a7f8f','#3f6fb0'][i%4],cls:c,prev:null,rn:i,lk:c?3:0})}
const remote={};let peer=null,conns=[],host=false,net={t:0};

const occB=(e,dir,sg)=>{const lo=Math.min(sg,sg+dir*1000),hi=Math.max(sg,sg+dir*1000);return allTrains().some(b=>{if(b.e!=e)return false;const t=b.s-b.dir*b.n*20,a=Math.min(b.s,t),z=Math.max(b.s,t);return z>lo&&a<hi})};

const xAct=(g,xs)=>{const gi=E.indexOf(g);return T.e==gi&&Math.abs(T.s-xs)<350||allTrains().some(b=>b.e==gi&&Math.abs(b.s-xs)<350)};
function tgt(){if(M&&!hasC[M.to][T.cls]){let b=0,bd=1e18;const p=NK[S.last],q=NK[M.to];NK.forEach((n,i)=>{if(n.t>=2&&hasC[i][0]&&hasC[i][1]){const d=Math.hypot(n.x-p.x,n.y-p.y)+Math.hypot(n.x-q.x,n.y-q.y);if(d<bd){bd=d;b=i}}});return b}return M?M.to:0}
function sendState(){if(!peer||!peer.id||!conns.length)return;const st={id:peer.id,e:T.e,s:T.s,dir:T.dir,v:T.v,n:TR.n,col:TR.c,lk:TR.lk,cls:TR.cls};conns.forEach(c=>c.open&&c.send(st))}
function hook(c){c.on('open',()=>{conns.push(c);toast('プレイヤーが接続しました')});c.on('data',d=>{if(!d||d.id==null)return;const r=remote[d.id]||(remote[d.id]={rn:0,prev:null});Object.assign(r,d,{prev:null});r.name=String(d.id).slice(0,4);if(host)conns.forEach(o=>o!==c&&o.open&&o.send(d))});c.on('close',()=>{conns=conns.filter(x=>x!=c);toast('切断されました')})}
function online(){if(peer)return toast('接続済みです');if(!window.Peer)return toast('オンライン機能を読み込めません(GitHub Pages版でご利用ください)');const code=(prompt('部屋コードを入力して参加。空欄で新しい部屋を作成')||'').trim();host=!code;peer=new Peer(host?'jr-'+Math.random().toString(36).slice(2,6):undefined);peer.on('open',id=>{if(host)toast('部屋コード: '+id.slice(3)+' を友達に伝えてください');else hook(peer.connect('jr-'+code))});peer.on('connection',hook);peer.on('error',e=>toast('接続エラー: '+e.type))}
function beep(){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=1750;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+.13)}
const toast=m=>{S.msg=m;S.mt=4};
function advance(o,ds){o.s+=o.dir*ds;const e=E[o.e];if(o.s>e.len||o.s<0){const k=o.s>e.len?1:0,ov=k?o.s-e.len:-o.s,L=cands(o.e,k,o.cls);
 if(!L.length){o.dir=-o.dir;o.s=k?e.len-ov:ov;o.prev=null;if(o===T)toast('終端駅で折り返し');return}
 const c=L[o===T?Math.min(L.length-1,T.pick):(o.rn=(o.rn+1)%L.length)];o.prev={e:o.e,dir:o.dir};o.e=c.e;const ne=E[c.e];if(c.k==0){o.dir=1;o.s=ov}else{o.dir=-1;o.s=ne.len-ov}

function back(o,d){const e=E[o.e];let s=o.s-o.dir*d;if(s<0||s>e.len){const ov=s<0?-s:s-e.len;if(o.prev){const p=o.prev,pe=E[p.e];return EP(pe,p.dir>0?pe.len-ov:ov)}}return EP(e,s)}
const zl=(e,s)=>{const c=e.c,pl=c?70:45;let l=c?285:110;if(s<400||s>e.len-400)l=c?160:70;for(const p of e.pl)if(Math.abs(s-p.s)<200)l=pl;return l};
function elim(){const e=E[T.e];let l=Math.min(zl(e,T.s),TR.mx);for(let d=50;d<=3600;d+=50){const sp=T.s+T.dir*d;if(sp<0||sp>e.len)break;const z=Math.min(zl(e,sp),TR.mx);l=Math.min(l,Math.sqrt(z*z/12.96+1.4*TR.bk*d)*3.6)}

 for(const b of allTrains()){if(b.e!=T.e)continue;const t=b.s-b.dir*b.n*20,a=Math.min(b.s,t),z=Math.max(b.s,t),d=T.dir>0?a-T.s:T.s-z;if(d>-5&&d<1500)l=Math.min(l,d<25?0:3.6*Math.sqrt(1.4*TR.bk*(d-25)))}

function plat(){const e=E[T.e];for(const p of e.pl){const sm=p.s+T.dir*50;if(Math.abs(T.s-sm)<25)return{p,sm}}return null}
const hasC=NK.map((n,i)=>[0,1].map(c=>E.some(e=>e.c==c&&(e.a==i||e.b==i))));
function newMission(){const L=NK.map((n,i)=>i).filter(i=>NK[i].t&&NK[i].t!=3&&i!=S.last),to=L[Math.floor(Math.random()*L.length)],a=NK[S.last],b=NK[to],km=Math.hypot(a.x-b.x,a.y-b.y)/1000;M={to,km,star:Math.min(5,1+Math.floor(km/300)),dl:S.t+km*1000/(TR.mx/3.6*.5)+600};T.pick=autoPick(T.e,T.dir)}
function door(){if(S.doors){if(S.board>0)return toast('乗降中です');S.doors=false;return}
 if(T.v>.01)return toast('走行中は開けられません');const p=plat();if(!p)return toast('ホームの停止位置ではありません');

function step(dt){

 bots.forEach(b=>advance(b,b.v*dt));Object.values(remote).forEach(r=>{if(r.e!=null)advance(r,r.v*dt)});if(E[T.e].xs.some(x=>Math.abs(T.s-x)<300)&&Math.floor(S.t*3.3)!=Math.floor((S.t-dt)*3.3))beep();

let AC,hum,hg;function au(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();hum=AC.createOscillator();hum.type='sawtooth';hg=AC.createGain();hg.gain.value=0;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;hum.connect(f);f.connect(hg);hg.connect(AC.destination);hum.start()}catch(e){AC=null}}
